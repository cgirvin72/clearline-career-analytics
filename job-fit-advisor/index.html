# Search Criteria (single source of truth)

*Updated 2026-08-13. This file is the one authoritative copy of Chris's job-search rules.*

**Everything else copies from here.** The leads-file Criteria tab, the job-posting-analyzer skill,
the clearline_context_brief.md snapshot, and the Job-Fit Advisor app all previously carried their
own drifting copies. When these rules change, change them here first, then run
vercel-fix/sync_resume_to_app.py to push them into the app.

---

## Target titles

**Primary.** Senior Data Analyst. Business Intelligence Analyst. Senior BI Analyst. BI Developer.
Business Intelligence Developer. Data Governance Analyst. Analytics Lead. Manager, Reporting & Insights.

**Acceptable with review.** Analytics Engineer (Microsoft or Fabric shops only). Data Modeler.
Financial Systems Analyst (Senior or Lead). Sr FinOps, RevOps, or Procurement Analytics.

**Avoid.** Pure Data Engineer (dbt, Spark, streaming). Data Scientist. ML Engineer.
Developer Advocate or Sales Engineer. Greenfield data-engineering builds.

**Rule:** judge every posting by its body, not its title. A title that looks right on a job that is
actually data engineering is a Trojan Horse and gets screened out.

---

## Hard knockouts (automatic SKIP, no further scoring)

- **Industry:** Healthcare. Insurance, including life and claims. Government and federal.
- **Location:** anything requiring relocation outside Dallas-Fort Worth. Remote is fine.
- **Onsite:** five days per week in office.
- **Sponsorship:** roles requiring an employer to sponsor.
- **Level:** Analyst titles without Senior or Lead designation. Too junior.

## Preferred industries

Financial services and fintech. Technology and SaaS. Energy and utilities. Retail and CPG.
Operations, supply chain, and logistics. Manufacturing. Professional services. Private equity.

---

## The preferred-vs-required rule

Treat a **hands-on tool or stack** listed as "preferred" that Chris does not have as a **de-facto
requirement**, and score it as a real gap. Interviewers probe these regardless of how the posting
labels them.

Tools that trigger this: dbt, Fivetran, Terraform, Data Vault, Looker, Domo, BigQuery, Databricks,
Airflow, Azure Synapse, Azure Data Factory, Microsoft Fabric, OneLake, Spark.

Non-tool "preferred" items (a degree, an industry background, years of experience above what he has)
do **not** trigger this rule. Ignore them.

---

## Fit threshold

Target **80%+ fit**. Chris manually reviews every job description regardless of score.
Below 80%, say so plainly rather than talking the role up.

---

## Compensation and arrangement

- Minimum $100K. Target $110K to $135K.
- Dallas-Fort Worth, hybrid, or fully remote.
- **Contract and contract-to-hire are preferred right now.** Runway is short. Say so in scoring:
  a contract role at target rate outranks a slightly better-fitting permanent role with a long process.
- Full-time, contract, and temporary are all acceptable.

---

## Credentials

- MBA, Business Administration. BS, Organizational Management. Master's-required roles are fine.
- **No certifications currently.** PL-300 (Power BI Data Analyst) is the top unlock and is the
  priority credential. If a posting requires or strongly prefers PL-300, flag it as a near-term
  unblock rather than a permanent gap.
- Open item: Workforce Solutions for North Central Texas, WIOA dislocated-worker funding may cover
  the PL-300 exam fee. Confirm whether PL-300 is on the eligible training provider list.

---

## The key targeting insight

**The modern data stack is the recurring disqualifier.** Target Microsoft and traditional-BI shops:
Power BI, DAX, SSIS, SSRS, SQL Server, Azure SQL, Snowflake. De-prioritize modern-data-stack
startups until dbt and Fabric are hands-on.

Search terms that work: Power BI Developer. SSRS Developer. SSIS Developer. SQL Server BI Developer.
Microsoft BI Developer. Business Intelligence Analyst. Data Governance Analyst.

Stop sourcing generic "BI" on boards dominated by modern-data-stack shops.

---

## Sourcing channels

- **Working:** Indeed connector. Claude for Chrome for LinkedIn and BuiltIn.
- **Not connecting:** Dice, ZipRecruiter. Retry in connector settings.
- **Avoid:** plain web-search X-ray. Produces mostly dead links.

---

## Energy and role fit (Sparketype)

Essentialist primary: creates order from chaos, governance, single source of truth. Score roles
that own definitions, standards, and reconciliation as **energizing**.

Maven shadow: deep technical mastery. Roles with real depth score well.

Advocate anti-type: persuasion, evangelism, and hype roles are **draining**. Score them down even
when the skills match.
